# Hemare - A cada push na main e a cada pull request: testes do backend (regras, estrutura e ponta a ponta),
# lint e build do frontend. Nao usa banco real nem chaves: os testes rodam com Postgres simulado (pg-mem).
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (npm test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
